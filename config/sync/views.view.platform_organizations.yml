          alter:
            alter_text: true
            text: "<div class=\"dropdown organization-actions\">\r\n  <button\r\n  class=\"btn btn-sm btn-outline-secondary dropdown-toggle\"\r\n  type=\"button\"\r\n  data-bs-toggle=\"dropdown\"\r\n  data-bs-boundary=\"viewport\"\r\n  aria-expanded=\"false\">\r\n  Actions\r\n</button>\r\n  <ul class=\"dropdown-menu dropdown-menu-end\">\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]group/{{ id }}\">\r\n        <i class=\"bi bi-eye\"></i>\r\n        View Organization\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/dashboard\">\r\n        <i class=\"bi bi-speedometer2\"></i>\r\n        Dashboard\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/administrators\">\r\n        <i class=\"bi bi-people\"></i>\r\n        Administrators\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/cards\">\r\n        <i class=\"bi bi-person-vcard\"></i>\r\n        Digital Cards\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/edit\">\r\n        <i class=\"bi bi-pencil\"></i>\r\n        Edit\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/subscription\">\r\n        <i class=\"bi bi-credit-card\"></i>\r\n        Subscription\r\n      </a>\r\n    </li>\r\n\r\n    <li><hr class=\"dropdown-divider\"></li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-warning\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/suspend\">\r\n        <i class=\"bi bi-pause-circle\"></i>\r\n        Suspend\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-success\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/activate\">\r\n        <i class=\"bi bi-check-circle\"></i>\r\n        Activate\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-danger\"\r\n         href=\"[site:url]platform/organizations/{{ id }}/delete\">\r\n        <i class=\"bi bi-trash\"></i>\r\n        Delete\r\n      </a>\r\n    </li>\r\n\r\n  </ul>\r\n</div>"
