            text: "<div class=\"dropdown card-actions-menu\">\r\n  <button\r\n    class=\"btn btn-sm btn-outline-secondary dropdown-toggle\"\r\n    type=\"button\"\r\n    data-bs-toggle=\"dropdown\"\r\n    data-bs-boundary=\"viewport\"\r\n    aria-expanded=\"false\">\r\n    Actions\r\n  </button>\r\n\r\n  <ul class=\"dropdown-menu dropdown-menu-end\">\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:node/{{ nid }}\">\r\n        <i class=\"bi bi-eye\"></i>\r\n        View\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item\"\r\n         href=\"[site:node/{{ nid }}/edit\">\r\n        <i class=\"bi bi-pencil\"></i>\r\n        Edit\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-danger\"\r\n         href=\"[site:node/{{ nid }}/delete\">\r\n        <i class=\"bi bi-trash\"></i>\r\n        Delete\r\n      </a>\r\n    </li>\r\n\r\n    <li><hr class=\"dropdown-divider\"></li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-warning\"\r\n         href=\"[site:platform/cards/{{ nid }}/change-status/card_workflow_pending\">\r\n        <i class=\"bi bi-hourglass-split\"></i>\r\n        Mark as Pending\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-success\"\r\n         href=\"[site:platform/cards/{{ nid }}/change-status/card_workflow_approved\">\r\n        <i class=\"bi bi-check-circle\"></i>\r\n        Approve\r\n      </a>\r\n    </li>\r\n\r\n    <li>\r\n      <a class=\"dropdown-item text-danger\"\r\n         href=\"site:platform/cards/{{ nid }}/change-status/card_workflow_rejected\">\r\n        <i class=\"bi bi-x-circle\"></i>\r\n        Reject\r\n      </a>\r\n    </li>\r\n\r\n  </ul>\r\n</div>"
