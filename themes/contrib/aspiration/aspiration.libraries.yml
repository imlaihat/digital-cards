    - core/jquery

color-palette:
  css:
    theme:
      assets/css/color-palette-library.css: { weight: 0 }

# Bootstrap Library from libraries folder.
bs-libraries:
  css:
    theme:
      /libraries/bootstrap/dist/css/bootstrap.min.css: { weight: -5 }
  js:
    /libraries/popper.js/dist/popper.min.js: {}
    /libraries/bootstrap/dist/js/bootstrap.bundle.min.js: {}

